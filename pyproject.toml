[project]
name = "local-rag"
version = "0.1.0"
description = "Fully-local agentic RAG over PDFs with hybrid text + visual (ColPali) retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sergio Carrero" }]
license = { text = "MIT" }

dependencies = [
    # PDF parsing & images
    "pymupdf>=1.24.0",
    "pillow>=12.3.0",
    # Vector store
    "chromadb>=0.5.5",
    # Agent orchestration
    "langgraph>=0.2.50",
    # Local model clients (llama-server is OpenAI-compatible)
    "openai>=1.40.0",
    # Visual document retrieval (ColPali / ColQwen2).
    # Pinned to the transformers 4.x line: transformers 5.x silently fails to apply
    # ColQwen2's LoRA adapter, which destroys visual retrieval quality. The resolver
    # picks the matching colpali-engine for this transformers range.
    "colpali-engine>=0.3.4,<0.3.12",
    "torch>=2.3.0",
    "transformers>=4.46.0,<5.0.0",
    # Utilities
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "huggingface-hub>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.2.0", "datasets>=2.20.0"]
ui = ["streamlit>=1.37.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
local-rag = "local_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag"]

[tool.uv]
# Security floors for transitive dependencies (pulled in by streamlit, ragas,
# chromadb, torch). A constraint only applies when the package is in the tree; it
# never adds one. Each floor is the first patched version of a Dependabot alert
# that `uv lock --upgrade` resolved on 2026-09-11 — keep them so a later re-lock
# cannot slide back below the fix.
constraint-dependencies = [
    "gitpython>=3.1.59",
    "aiohttp>=3.14.3",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "langsmith>=0.8.18",
    "langchain>=1.3.9",
    "setuptools>=83.0.0",
    "accelerate>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/local_rag --cov-report=term-missing --cov-report=xml --cov-fail-under=95"

[tool.coverage.run]
branch = false
source = ["src/local_rag"]

[tool.coverage.report]
# Measured 98% at the time the floor was set (see README badge); floor = measured − 3.
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
