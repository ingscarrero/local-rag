name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job writes to the repo, so the GITHUB_TOKEN only needs to
# read contents (checkout). Widen per-job if a step ever needs more.
permissions:
  contents: read

env:
  # Dummy values so Settings() can be instantiated without a .env. No model
  # server is ever contacted: every LLM/embedding/vision call is faked in tests.
  LLM_BASE_URL: "http://127.0.0.1:8080/v1"
  LLM_MODEL: "local-chat"
  EMBED_BASE_URL: "http://127.0.0.1:8081/v1"
  EMBED_MODEL: "local-embed"
  VLM_BASE_URL: "http://127.0.0.1:8082/v1"
  VLM_MODEL: "local-vlm"
  OPENAI_API_KEY: "not-a-real-key"
  ANONYMIZED_TELEMETRY: "False"

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy type-check
        run: uv run mypy src/local_rag --ignore-missing-imports

  unit-tests:
    name: Unit tests (no models required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        # Coverage flags and the 95% floor live in [tool.pytest.ini_options].
        run: uv run pytest tests/ --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
